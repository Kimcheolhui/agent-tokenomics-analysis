<title>Agent 토큰 비용 진단 보고서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 단일 보고서 컬럼(최대 68rem). 장 번호는 진단 순서(요약 → 증상 → 원인 → 범위)를 따르고, 카드는 원인 상세에만 쓴다. */
:root {
  --bg: #f2f3f5;
  --surface: #fcfcfd;
  --sunken: #e9ebef;
  --ink: #14161b;
  --ink-2: #4a4f59;
  --muted: #747a85;
  --line: #dde0e5;
  --axis: #c2c6ce;
  --accent: #1f62b8;
  --c1: #2a78d6;
  --c2: #eb6834;
  --c3: #1baf7a;
  --c4: #eda100;
  --c5: #e87ba4;
  --on-c4: #0b0b0b;
  --v1-soft: #86b6ef;
  --quiet: #b3b9c3;
  --crit: #d03b3b;
  --serious: #ec835a;
  --warn: #fab219;
  --good: #0ca30c;
  --crit-tint: rgba(208, 59, 59, 0.10);
  --serious-tint: rgba(236, 131, 90, 0.16);
  --warn-tint: rgba(250, 178, 25, 0.16);
  --good-tint: rgba(12, 163, 12, 0.09);
  --nodata-tint: rgba(116, 122, 133, 0.13);
  --tip-bg: #14161b;
  --tip-ink: #f2f3f5;
  --font-sans: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #16191d; --sunken: #22262c; --ink: #eceef2; --ink-2: #b6bbc5; --muted: #8a909a;
    --line: #2a2e35; --axis: #3d424a; --accent: #6aa5ee;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --on-c4: #ffffff;
    --v1-soft: #1c5cab; --quiet: #4b515b;
    --crit-tint: rgba(208, 59, 59, 0.20); --serious-tint: rgba(236, 131, 90, 0.20); --warn-tint: rgba(250, 178, 25, 0.16);
    --good-tint: rgba(12, 163, 12, 0.16); --nodata-tint: rgba(138, 144, 154, 0.16);
    --tip-bg: #eceef2; --tip-ink: #14161b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #16191d; --sunken: #22262c; --ink: #eceef2; --ink-2: #b6bbc5; --muted: #8a909a;
  --line: #2a2e35; --axis: #3d424a; --accent: #6aa5ee;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --on-c4: #ffffff;
  --v1-soft: #1c5cab; --quiet: #4b515b;
  --crit-tint: rgba(208, 59, 59, 0.20); --serious-tint: rgba(236, 131, 90, 0.20); --warn-tint: rgba(250, 178, 25, 0.16);
  --good-tint: rgba(12, 163, 12, 0.16); --nodata-tint: rgba(138, 144, 154, 0.16);
  --tip-bg: #eceef2; --tip-ink: #14161b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.page { max-width: 68rem; margin: 0 auto; padding-block: 2rem 4rem; }

/* 머리말 */
.mast { display: grid; gap: 1rem; }
.kicker { margin: 0; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.mast h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.375rem); line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; }
.mast-sub { margin: -0.375rem 0 0; font-size: 1.0625rem; color: var(--ink-2); }
.mast-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); margin: 0.25rem 0 0; border-top: 1px solid var(--line); }
.mast-meta div { padding: 0.625rem 1rem 0.625rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
.mast-meta dt { font-size: 0.75rem; color: var(--muted); }
.mast-meta dd { margin: 0; font-size: 0.875rem; overflow-wrap: anywhere; }
.sample { display: flex; gap: 0.5rem; align-items: flex-start; margin: 0; padding: 0.625rem 0.875rem; border-radius: 8px; background: var(--warn-tint); font-size: 0.8125rem; color: var(--ink); max-width: 60rem; }
.sample .ico { color: var(--warn); margin-top: 0.3rem; }

/* 고정 탐색 줄 */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem;
  margin-top: 1.5rem; padding-block: 0.5rem; background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-nav { display: flex; gap: 0.125rem; overflow-x: auto; min-width: 0; }
.bar-nav a { font-size: 0.8125rem; color: var(--ink-2); text-decoration: none; padding: 0.375rem 0.625rem; border-radius: 6px; white-space: nowrap; }
.bar-nav a:hover { background: var(--sunken); color: var(--ink); }
.bar-nav .n { font-family: var(--font-mono); color: var(--muted); margin-right: 0.25rem; }
.seg-ctl { display: inline-flex; flex: none; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg-ctl button { font: inherit; font-size: 0.8125rem; border: 0; background: transparent; color: var(--ink-2); padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; }
.seg-ctl button:hover { color: var(--ink); }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg-ctl .cnt { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.75; margin-left: 0.25rem; }

/* 장 */
.sec { display: grid; gap: 1.25rem; padding-top: 2.75rem; scroll-margin-top: 3.5rem; }
.sec-h { display: flex; align-items: center; gap: 0.75rem; margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
.sec-no { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); border: 1px solid var(--axis); border-radius: 4px; padding: 0 0.4rem; line-height: 1.6; }
.lede { margin: 0; max-width: 65ch; color: var(--ink-2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1.25rem 1rem; min-width: 0; }
.small { font-size: 0.8125rem; color: var(--ink-2); margin: 0; }

/* 요약 */
.lead { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.625rem; max-width: 64ch; }
.lead li { position: relative; padding-left: 1.125rem; font-size: 1.0625rem; line-height: 1.6; }
.lead li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 0.4rem; height: 0.4rem; border-radius: 1px; background: var(--ink); }
.lead li:first-child { font-size: 1.1875rem; font-weight: 600; }
.lead li:first-child::before { width: 0.5rem; height: 0.5rem; top: 0.66em; }
.scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); margin: 0; border-block: 1px solid var(--line); }
.scope div { padding: 0.75rem 1rem 0.75rem 0; min-width: 0; }
.scope dt { font-size: 0.75rem; color: var(--muted); }
.scope dd { margin: 0.125rem 0 0; font-size: 1.3125rem; font-weight: 600; letter-spacing: -0.01em; }
.scope dd .u { font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); margin-left: 0.125rem; }
.prices { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; font-size: 0.75rem; color: var(--ink-2); margin: 0; }
.prices code { font-family: var(--font-mono); font-size: 0.75rem; }

/* 공통 칩·배지 */
.ico { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: -1px; }
.code { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; padding: 0.0625rem 0.375rem; border-radius: 4px; background: var(--sunken); color: var(--ink); white-space: nowrap; }
.code.big { font-size: 0.9375rem; padding: 0.1875rem 0.5rem; }
.tag { font-size: 0.6875rem; font-weight: 600; color: var(--ink-2); border: 1px solid var(--axis); border-radius: 999px; padding: 0 0.4rem; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.125rem 0.55rem; border-radius: 999px; background: var(--vt); color: var(--ink); font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.pill .ico, .cchip .ico, .mx-top .ico, .chip-st .ico { color: var(--vc); }
.v-hit { --vc: var(--crit); --vt: var(--crit-tint); }
.v-cand { --vc: var(--serious); --vt: var(--serious-tint); }
.v-no { --vc: var(--good); --vt: var(--good-tint); }
.v-nodata { --vc: var(--muted); --vt: var(--nodata-tint); }
.v-hold { --vc: var(--warn); --vt: var(--warn-tint); }
.v-skip { --vc: var(--muted); --vt: transparent; }
.cchip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.0625rem 0.4rem; border-radius: 4px; background: linear-gradient(var(--vt), var(--vt)), var(--sunken); font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.cchip:hover { outline: 1px solid var(--axis); }
.chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; list-style: none; margin: 0; padding: 0; font-size: 0.75rem; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 0.375rem; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.sw.line { height: 2px; width: 14px; border-radius: 1px; }

/* 색 역할 (div는 background, svg는 fill) */
.t-v1, .c1 { background: var(--c1); fill: var(--c1); }
.c2 { background: var(--c2); fill: var(--c2); }
.c3 { background: var(--c3); fill: var(--c3); }
.c4 { background: var(--c4); fill: var(--c4); }
.c5 { background: var(--c5); fill: var(--c5); }
.t-v1soft { background: var(--v1-soft); fill: var(--v1-soft); }
.t-crit { background: var(--crit); fill: var(--crit); }
.t-serious { background: var(--serious); fill: var(--serious); }
.t-quiet { background: var(--quiet); fill: var(--quiet); }

/* 그림 */
.fig { margin: 0; min-width: 0; display: grid; gap: 0.625rem; align-content: start; }
.fig-head h4 { margin: 0; font-size: 0.9375rem; font-weight: 600; line-height: 1.4; }
.fig-sub { margin: 0.125rem 0 0; font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; }
.fig-body { min-width: 0; }
.fig-note { margin: 0; font-size: 0.75rem; color: var(--ink-2); max-width: 70ch; }
.fig-table summary { font-size: 0.75rem; color: var(--accent); cursor: pointer; width: max-content; }
.fig-table[open] summary { margin-bottom: 0.5rem; }

/* 가로 막대 (HTML) */
.hb { container-type: inline-size; display: grid; --lw: 12rem; --vw: 7.5rem; }
.hb-row { display: grid; grid-template-columns: minmax(0, var(--lw)) minmax(0, 1fr) var(--vw); column-gap: 0.875rem; align-items: center; }
.hb-label { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.375rem; font-size: 0.8125rem; line-height: 1.35; padding-block: 0.25rem; }
.hb-label a { color: var(--ink); text-decoration: none; }
.hb-label a:hover { text-decoration: underline; }
.hb-scale { position: relative; height: 2.25rem; }
.hb-tick { position: absolute; bottom: 0.125rem; transform: translateX(-50%); font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-tick.first { transform: none; }
.hb-thr-label { position: absolute; top: 0; transform: translateX(-50%); font-size: 0.6875rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.hb-thr-label.edge-r { transform: translateX(-100%); }
.hb-thr-label.edge-l { transform: none; }
.hb-track {
  position: relative; min-height: 2rem; align-self: stretch; border-left: 1px solid var(--axis);
  background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
  background-size: var(--gs) 100%; background-repeat: repeat-x;
}
.hb-track[tabindex] { cursor: default; }
.hb-track:hover .hb-bar, .hb-track:focus-visible .hb-bar { filter: brightness(1.1); }
.hb-track:focus-visible { outline-offset: 0; }
.hb-bar { position: absolute; left: 0; top: 50%; height: 14px; transform: translateY(-50%); border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-stack { position: absolute; left: 0; top: 50%; height: 14px; transform: translateY(-50%); display: flex; gap: 2px; }
.hb-stack .seg { height: 100%; min-width: 2px; }
.hb-stack .seg:last-child { border-radius: 0 4px 4px 0; }
.hb-stack .seg:hover, .hb-stack .seg:focus-visible { filter: brightness(1.12); }
.hb-thr { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--ink-2); pointer-events: none; }
.hb-chip { position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; color: var(--ink-2); background: var(--vt); padding: 0.0625rem 0.5rem; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 0.75rem); overflow: hidden; text-overflow: ellipsis; }
.hb-chip .ico { color: var(--vc); }
.hb-val { display: flex; flex-direction: column; line-height: 1.3; font-size: 0.8125rem; font-variant-numeric: tabular-nums; min-width: 0; }
.hb-num { display: inline-flex; align-items: center; gap: 0.3rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
.hb-num .ico { color: var(--crit); width: 10px; height: 10px; }
.hb-aside { font-size: 0.75rem; color: var(--muted); }
.hb .legend { margin-bottom: 0.25rem; }
@container (max-width: 34rem) {
  .hb-row { grid-template-columns: minmax(0, 1fr) var(--vw); grid-template-areas: "label label" "track val"; }
  .hb-label { grid-area: label; padding-top: 0.5rem; padding-bottom: 0; }
  .hb-track, .hb-scale { grid-area: track; }
  .hb-val { grid-area: val; }
  .hb-axis { grid-template-areas: "track val"; }
  .hb-axis .hb-label { display: none; }
}

/* 분할 막대 */
.segbar { display: flex; gap: 2px; height: 28px; }
.segpart { display: flex; align-items: center; padding-inline: 0.5rem; min-width: 0; border-radius: 4px; color: #ffffff; font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.segpart.c4 { color: var(--on-c4); }
.segpart:hover, .segpart:focus-visible { filter: brightness(1.1); }
.segpart span[hidden] { display: none; }
.seg-total { margin: 0.5rem 0 0; font-size: 0.75rem; color: var(--ink-2); }

/* SVG 그림 */
.viz { display: block; overflow: visible; }
.viz text { font-family: var(--font-sans); font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.viz .grid { stroke: var(--line); stroke-width: 1; }
.viz .axis { stroke: var(--axis); stroke-width: 1; }
.viz .hit { fill: transparent; }
.viz .col { outline: none; }
.viz .col:hover .mark, .viz .col:focus-visible .mark { opacity: 0.8; }
.viz .col:focus-visible .hit { stroke: var(--accent); stroke-width: 1.5; }
.viz .thr { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.viz .stat { stroke: var(--muted); stroke-width: 1; }
.viz .mlabel { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.viz .cap { fill: var(--ink); font-weight: 600; font-size: 11.5px; }
.viz .xtitle { fill: var(--muted); font-size: 11px; }
.viz .line { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz .area { fill: var(--c1); opacity: 0.1; }
.viz .dot { fill: var(--c1); stroke: var(--surface); stroke-width: 2; }
.viz .note { fill: var(--ink); font-size: 11.5px; font-weight: 500; }
.viz .xhair { stroke: var(--ink-2); stroke-width: 1; }
.viz .overlay { fill: transparent; outline: none; }
.viz .overlay:focus-visible { stroke: var(--accent); stroke-width: 1.5; }
.viz .whisk { stroke: var(--ink-2); stroke-width: 1.5; }
.viz .med { stroke: var(--surface); stroke-width: 3; }
.viz .blabel { fill: var(--ink); font-size: 12.5px; }

/* 원문 증거 */
.diff { display: grid; gap: 0.5rem; }
.diff-meta { margin: 0; font-size: 0.8125rem; color: var(--ink-2); }
.diff-lines { border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; background: var(--bg); padding-block: 0.375rem; }
.d-row { display: grid; grid-template-columns: 4.5rem max-content; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.75; }
.d-gut { color: var(--muted); padding-inline: 0.75rem; font-size: 0.6875rem; user-select: none; white-space: nowrap; }
.d-txt { white-space: pre; padding-right: 1rem; color: var(--ink); font-family: inherit; }
.d-same .d-txt { color: var(--ink-2); }
.d-a, .d-b { background: var(--serious-tint); }
.d-row mark { background: var(--crit-tint); color: var(--ink); box-shadow: inset 0 -2px 0 var(--crit); border-radius: 2px; }
.d-more .d-txt { font-family: var(--font-sans); color: var(--muted); font-size: 0.75rem; }
.ldiff { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
.ldiff h5 { margin: 0 0 0.375rem; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
.ldiff ol { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.ldiff li { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; gap: 0.5rem; padding: 0.3rem 0.625rem; font-family: var(--font-mono); font-size: 0.78rem; border-bottom: 1px solid var(--line); }
.ldiff li:last-child { border-bottom: 0; }
.ldiff li .i { color: var(--muted); }
.ldiff li.moved { background: var(--serious-tint); }
.ldiff li .mv { font-family: var(--font-sans); font-size: 0.6875rem; color: var(--ink-2); white-space: nowrap; }
.pairs { display: grid; gap: 0.75rem; }
.pair { display: grid; gap: 0.375rem; padding: 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.msg { margin: 0; justify-self: start; max-width: 100%; padding: 0.375rem 0.75rem; border-radius: 10px 10px 10px 2px; background: var(--surface); border: 1px solid var(--line); font-size: 0.875rem; }
.pair-gap { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--ink-2); padding-left: 0.5rem; }
.simbar { width: 4rem; height: 6px; border-radius: 3px; background: var(--sunken); position: relative; overflow: hidden; }
.simbar i { position: absolute; inset: 0 auto 0 0; background: var(--crit); border-radius: 3px; }

/* 표 */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; }
th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 0.5rem 0.625rem; white-space: nowrap; }
td { border-bottom: 1px solid var(--line); padding: 0.5rem 0.625rem; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.sym-table { min-width: 54rem; }
.sym-table td:nth-child(2) { font-weight: 500; }
.sym-table tr { scroll-margin-top: 4rem; }
.sym-table tr:target td { background: var(--sunken); }
.chip-st { display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
.basis-table { min-width: 36rem; }

/* 원인 카드 */
.causes { display: grid; gap: 1.25rem; }
.cat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.cat-head:first-child { border-top: 0; padding-top: 0; }

  if (spec.note) fig.append(el('p', { class: 'fig-note', text: spec.note }));
  if (!opts.noTable) { const tb = tableFor(spec); if (tb) fig.append(tb); }
  return fig;
}

/* =====================================================================
   보고서 조립
   ===================================================================== */
const R = REPORT;
const CAUSE = Object.fromEntries(R.causes.map(c => [c.id, c]));
const SYMP = Object.fromEntries(R.symptoms.map(s => [s.id, s]));
const isCard = c => (c.verdict === '해당' || c.verdict === '후보') && c.waste;
let mode = 'report';

function thrText(s) {
  if (s.thresholdText) return s.thresholdText;
  return `${s.dir === 'lower' ? '<' : '≥'} ${fmtV(s.fmt, s.threshold)}`;
}
function causeChip(id) {
  const c = CAUSE[id];
  const v = VERDICT[c.verdict];
  return el('a', { class: `cchip ${v.cls}`, href: '#cause-' + id, 'data-cause': id, title: `${id} ${c.name} · ${c.verdict}`, 'aria-label': `${id} ${c.name}, ${c.verdict}` }, icon(v.icon), id);
}

function renderMast() {
  const m = R.meta;
  const items = [
    ['분석 기간', `${m.period.from} – ${m.period.to} (${m.period.days}일)`],
    ['대상 에이전트', m.agents.join(', ')],
    ['Foundry 프로젝트', m.project],
    ['Application Insights', m.appInsights],
    ['모델', m.models],
    ['데이터 원본', m.sources],
    ['작성', `${m.date} · ${m.author}`],
  ];
  document.getElementById('top').append(
    el('p', { class: 'kicker', text: 'Microsoft Foundry · Application Insights' }),
    el('h1', { text: m.title }),
    el('p', { class: 'mast-sub', text: `${m.customer} · ${m.service}` }),
    el('dl', { class: 'mast-meta' }, items.map(([k, v]) => el('div', {}, el('dt', { text: k }), el('dd', { text: v })))),
    ...(m.sample ? [el('p', { class: 'sample' }, icon('info'), el('span', { text: '예시 데이터로 채운 템플릿이다. 숫자와 이름은 실제 고객 값이 아니다. 채우는 방법은 페이지 맨 아래 "템플릿 채우는 법"에 있다.' }))] : []),
  );
}

function section(id, no, title) {
  return el('section', { class: 'sec', id: 'sec-' + id, 'aria-labelledby': 'h-' + id },
    el('h2', { class: 'sec-h', id: 'h-' + id }, el('span', { class: 'sec-no', text: String(no) }), title));
}

function renderSummary() {
  const m = R.meta;
  const s = section('summary', 1, '요약');
  s.append(el('ul', { class: 'lead' }, m.summary.map(t => el('li', { text: t }))));
  s.append(el('dl', { class: 'scope' },
    [['분석 기간 비용', '$' + NF.format(m.totalCost), ''], ['턴', NF.format(m.turns), ''], ['LLM 호출', NF.format(m.calls), ''], ['캐시율', pctStr(m.cacheRate), ''], ['고정 Input S_a', NF.format(m.fixedInput), 'tok']]
      .map(([k, v, u]) => el('div', {}, el('dt', { text: k }), el('dd', {}, v, u ? el('span', { class: 'u', text: u }) : null)))));
  const ranked = R.causes.filter(isCard).sort((a, b) => b.waste.usd - a.waste.usd);
  const panel = el('div', { class: 'panel' });
  panel.append(figure({
    type: 'hbar', title: `원인별 낭비 추정 (분석 기간 ${m.period.days}일, USD)`,
    sub: '원인끼리 같은 토큰을 겹쳐 셀 수 있어 합산하지 않는다. 항목을 누르면 3장의 상세로 이동한다.',
    fmt: 'usd', labelWidth: '15rem', valueWidth: '8.5rem',
    legend: [{ tone: 't-v1', label: '해당' }, { tone: 't-v1soft', label: '후보' }],
    rows: ranked.map(c => ({
      code: c.id, label: c.name, href: '#cause-' + c.id, causeId: c.id, value: c.waste.usd,
      tone: c.verdict === '해당' ? 'v1' : 'v1soft',
      aside: `비용의 ${pctStr(c.waste.usd / m.totalCost)}${c.waste.bound ? ' · 상한' : ''}`,
    })),
  }));
  s.append(panel);
  s.append(el('p', { class: 'prices' },
    el('span', { text: '계산 전제 (예시 단가, USD / 1M tok):' }),
    m.prices.map(p => el('span', {}, el('code', { text: p.model }), ` 입력 ${p.pin.toFixed(2)} · 캐시 ${p.pcache.toFixed(2)} · 출력 ${p.pout.toFixed(2)}`)),
    el('span', {}, el('code', { text: 'P_eff' }), ` ${m.peff} (캐시율 ${pctStr(m.cacheRate)} 반영)`)));
  return s;
}

function renderSymptoms() {
  const s = section('symptoms', 2, '증상 점검');
  const counts = {};
  R.symptoms.forEach(x => { counts[x.status] = (counts[x.status] || 0) + 1; });
  const parts = ['abnormal', 'normal', 'nodata', 'hold'].filter(k => counts[k]).map(k => `${SYM[k].label} ${counts[k]}개`);
  s.append(el('p', { class: 'lede', text: `증상 ${R.symptoms.length}개 가운데 ${parts.join(', ')}다. 이상이 나온 증상에서 이어지는 원인만 3장에서 상세히 본다.` }));
  const rows = R.symptoms.map(x => {
    const base = { code: x.id, label: x.name, href: '#sym-' + x.id };
    if (x.value == null || x.threshold == null) {
      const chipText = x.status === 'abnormal' ? '이상 · 단계 비교로 판정' : x.status === 'nodata' ? `계측 부재 · ${x.note || ''}` : SYM[x.status].label;
      return { ...base, chip: x.status, chipText, aside: x.display || x.thresholdText || null };
    }
    const sev = x.dir === 'lower' ? x.threshold / x.value : x.value / x.threshold;
    return { ...base, value: sev, aside: `${fmtV(x.fmt, x.value)} · 기준 ${thrText(x)}` };
  });
  const sevMax = Math.max(2, ...rows.filter(r => r.value != null).map(r => r.value * 1.06));
  const panel = el('div', { class: 'panel' });
  panel.append(figure({
    type: 'hbar', title: '증상별 기준 대비 배수',
    sub: '막대 = 현재 값 ÷ 기준. 캐시 달성률처럼 낮을수록 나쁜 지표는 기준 ÷ 값으로 뒤집어, 모든 막대가 오른쪽일수록 나쁘다.',
    fmt: 'x', labelWidth: '16.5rem', valueWidth: '10rem', max: sevMax,
    threshold: { value: 1, dir: 'above', label: '기준 1×' },
    rows,
  }, { noTable: true }));
  s.append(panel);
  const table = el('table', { class: 'sym-table' },
    el('thead', {}, el('tr', {}, ['ID', '증상', '지표', '현재 값', '기준', '상태', '이어지는 원인'].map((h, i) => el('th', { class: i === 3 ? 'num' : null, text: h })))),
    el('tbody', {}, R.symptoms.map(x => {
      const st = SYM[x.status];
      return el('tr', { id: 'sym-' + x.id },
        el('td', {}, el('span', { class: 'code', text: x.id })),
        el('td', { text: x.name }),
        el('td', { text: x.metric }),
        el('td', { class: 'num', text: x.value != null ? fmtV(x.fmt, x.value) : (x.display || '—') }),
        el('td', { text: thrText(x) }),
        el('td', {}, el('span', { class: `chip-st ${st.cls}` }, icon(st.icon), st.label)),
        el('td', {}, el('span', { class: 'chips' }, x.causes.map(causeChip))));
    })));
  s.append(el('div', { class: 'panel' }, el('div', { class: 'tbl-wrap' }, table)));
  return s;
}

function causeCard(c, catalog) {
  const cat = c.id[0];
  const card = isCard(c);
  const art = el('article', { class: 'cause' + (catalog && !card ? ' example' : ''), id: 'cause-' + c.id, tabindex: '-1', 'aria-labelledby': 'ch-' + c.id });
  const status = el('div', { class: 'cause-status' }, verdictPill(c.verdict, catalog ? '이번 판정 · ' : ''));
  if (card) status.append(el('p', { class: 'cause-waste' },
    el('span', { class: 'lbl', text: '낭비 추정' }), el('strong', { text: fmtV('usd', c.waste.usd) }),
    el('span', { class: 'share', text: `비용의 ${pctStr(c.waste.usd / R.meta.totalCost)}${c.waste.bound ? ' · 상한' : ''}` })));
  art.append(el('header', { class: 'cause-head' },
    el('div', { class: 'cause-title' }, el('span', { class: 'code big', text: c.id }),
      el('div', {}, el('p', { class: 'cause-cat', text: `${cat} · ${R.categories[cat].name}` }), el('h3', { id: 'ch-' + c.id, text: c.name }))),
    status));
  if (c.from && c.from.length) art.append(el('p', { class: 'cause-from' }, el('span', { class: 'lbl', text: '발견 경로' }),
    c.from.map(sid => el('a', { class: 'schip', href: '#sym-' + sid, text: `${sid} ${SYMP[sid].name}` }))));
  if (card && c.finding) art.append(el('p', { class: 'finding', text: c.finding }));
  else if (catalog) art.append(el('p', { class: 'finding example', text: `아래 그림은 이 원인이 해당할 때의 모습을 보여주는 예시다. 이번 판정 근거: ${c.basis || c.verdict}.` }));
  art.append(el('p', { class: 'rule' }, el('b', { text: '판정 기준 ' }), c.rule));
  const charts = c.charts || [];
  const lone = charts.filter(ch => !ch.wide).length === 1;
  if (charts.length) art.append(el('div', { class: 'figs' }, charts.map(ch => figure(lone && !ch.wide ? { ...ch, wide: true } : ch))));
  if (card) {
    const foot = el('div', { class: 'cause-foot' });
    foot.append(el('div', {}, el('h4', { text: '낭비 추정 계산' }), el('code', { class: 'formula', text: c.waste.formula }), el('p', { class: 'inputs', text: c.waste.inputs })));
    if (c.differential && c.differential.length) foot.append(el('div', {}, el('h4', { text: '다른 원인과의 감별·겹침' }), el('ul', {}, c.differential.map(t => el('li', { text: t })))));
    art.append(foot);
  }
  return art;
}

function renderCausesInto(host) {
  host.replaceChildren();
  const list = el('div', { class: 'causes' });
  if (mode === 'report') {
    const cards = R.causes.filter(isCard).sort((a, b) => b.waste.usd - a.waste.usd);
    const nHit = cards.filter(c => c.verdict === '해당').length;
    host.append(el('p', { class: 'lede', text: `이상 증상에서 이어진 원인 가운데 해당 ${nHit}개와 후보 ${cards.length - nHit}개를 낭비 추정이 큰 순서로 나열한다. 나머지 원인의 판정 근거는 4장에 있고, 모든 원인의 그림 예시는 위쪽 "그림 카탈로그"에서 볼 수 있다.` }));
    cards.forEach(c => list.append(causeCard(c, false)));
  } else {
    host.append(el('p', { class: 'lede', text: `원인 ${R.causes.length}개 전체의 그림이다. 이번 보고서에 카드로 나오지 않는 원인은 점선 테두리로 표시하고, 그 원인이 해당할 때 어떤 그림이 나오는지 예시 데이터로 나타낸다.` }));
    for (const L of Object.keys(R.categories)) {
      list.append(el('div', { class: 'cat-head' }, el('span', { class: 'code', text: L }), el('h3', { text: R.categories[L].name }), el('p', { text: `키우는 항: ${R.categories[L].term}` })));
      R.causes.filter(c => c.id[0] === L).forEach(c => list.append(causeCard(c, true)));
    }
  }
  host.append(list);
}

function renderCauses() {
  const s = section('causes', 3, '원인 상세');
  const host = el('div', { id: 'causes-host', style: 'display:grid;gap:1.25rem' });
  s.append(host);
  renderCausesInto(host);
  return s;
}

function renderScope() {
  const s = section('scope', 4, '점검 범위');
  s.append(el('p', { class: 'lede', text: `원인 ${R.causes.length}개 전체의 판정이다. 칸을 누르면 해당 원인의 상세나 그림 예시로 이동한다.` }));
  const counts = {};
  R.causes.forEach(c => { counts[c.verdict] = (counts[c.verdict] || 0) + 1; });
  s.append(el('ul', { class: 'counts', 'aria-label': '판정별 개수' },
    Object.keys(VERDICT).filter(v => counts[v]).map(v => el('li', { class: VERDICT[v].cls }, icon(VERDICT[v].icon), v, el('b', { text: String(counts[v]) })))));
  const mx = el('div', { class: 'mx' });
  for (const L of Object.keys(R.categories)) {
    mx.append(el('div', { class: 'mx-row' },
      el('div', { class: 'mx-cat' }, el('span', { class: 'code', text: L }), el('span', { text: R.categories[L].name })),
      el('div', { class: 'mx-cells' }, R.causes.filter(c => c.id[0] === L).map(c => {
        const v = VERDICT[c.verdict];
        return el('a', { class: `mx-cell ${v.cls}`, href: '#cause-' + c.id, 'data-cause': c.id, 'aria-label': `${c.id} ${c.name}, ${c.verdict}` },
          el('span', { class: 'mx-top' }, el('span', { class: 'code', text: c.id }), icon(v.icon)),
          el('span', { class: 'mx-name', text: c.name }),
          el('span', { class: 'mx-v', text: c.verdict + (isCard(c) ? ` · ${fmtV('usd', c.waste.usd)}` : '') }));
      }))));
  }
  s.append(el('div', { class: 'panel' }, mx));
  const rest = R.causes.filter(c => !isCard(c));
  const table = el('table', { class: 'basis-table' },
    el('thead', {}, el('tr', {}, ['원인', '판정', '근거'].map(h => el('th', { text: h })))),
    el('tbody', {}, rest.map(c => el('tr', {},
      el('td', {}, el('span', { class: 'chips' }, causeChip(c.id), el('span', { text: c.name }))),
      el('td', {}, verdictPill(c.verdict)),
      el('td', { text: c.basis || '' })))));
  s.append(el('div', { class: 'panel' }, el('h3', { style: 'margin:0 0 .75rem;font-size:1rem', text: '카드가 없는 원인의 판정 근거' }), el('div', { class: 'tbl-wrap' }, table)));
  return s;
}

function renderHowto() {
  const types = [
    ['hbar', '가로 막대. threshold(value, dir, label)를 넣으면 기준선과 초과 강조가 붙는다.', 'A1, A4, B1, B2, C2, D3, D4, E4, F1, F2, F4'],
    ['stackbar', '누적 가로 막대. series와 rows[].segs.', 'B4, E1'],
    ['segbar', '전체를 나눈 분할 막대. parts[].', 'B3'],
    ['columns', '세로 막대·히스토그램. bins[], markers(at = 구간 단위 위치).', 'A3, A5, A6, C3, D1, D2, E3'],
    ['line', '선 그래프. points[], threshold, annotations, vmarkers.', 'C1, C2'],
    ['box', '상자 그림. rows[].v = [최소, Q1, 중앙값, Q3, 최대].', 'E2'],
    ['diff · listdiff · pairs', '원문 증거. 프롬프트 차이, tool 순서 차이, 재질문 쌍.', 'A1, A2, F3'],
  ];
  return el('details', { class: 'howto' },
    el('summary', { text: '템플릿 채우는 법' }),
    el('div', { class: 'howto-body' },
      el('p', {}, '모든 값은 이 파일 아래쪽 ', el('code', { text: '<script>' }), '의 ', el('code', { text: 'REPORT' }), ' 객체 하나에 있다. 진단 가이드의 쿼리 결과를 옮겨 넣고 저장하면 그림이 다시 그려진다.'),
      el('ul', {},
        el('li', {}, el('code', { text: 'meta' }), ': 머리말, 요약 문장, 비용·턴·호출 수, 단가. ', el('code', { text: 'sample: false' }), '로 바꾸면 예시 안내가 사라진다.'),
        el('li', {}, el('code', { text: 'symptoms' }), ': 증상 12개. ', el('code', { text: 'status' }), '는 abnormal, normal, nodata, hold 중 하나. 수치 기준이 있으면 value, threshold, dir(higher | lower)를 넣는다.'),
        el('li', {}, el('code', { text: 'causes' }), ': 원인 25개. ', el('code', { text: 'verdict' }), '는 해당, 후보, 비해당, 계측 부재, 판정 보류, 미점검 중 하나. 해당·후보이면서 waste가 있으면 3장 카드가 되고 1장 순위에 들어간다. 나머지는 basis가 4장 표에 나온다.'),
        el('li', {}, el('code', { text: 'charts' }), ': 원인마다 그림 1–2개. 아래 표의 type 중 하나를 고른다.')),
      el('div', { class: 'tbl-wrap' }, el('table', {},
        el('thead', {}, el('tr', {}, ['type', '내용', '쓰는 원인'].map(h => el('th', { text: h })))),
        el('tbody', {}, types.map(r => el('tr', {}, el('td', {}, el('code', { text: r[0] })), el('td', { text: r[1] }), el('td', { text: r[2] }))))))));
}

function setMode(next) {
  if (next === mode) return;
  mode = next;
  document.getElementById('mode-report').setAttribute('aria-pressed', String(mode === 'report'));
  document.getElementById('mode-catalog').setAttribute('aria-pressed', String(mode === 'catalog'));
  renderCausesInto(document.getElementById('causes-host'));
}

function boot() {
  renderMast();
  const main = document.getElementById('report');
  main.append(renderSummary(), renderSymptoms(), renderCauses(), renderScope(), renderHowto());
  document.getElementById('mode-report').addEventListener('click', () => setMode('report'));
  document.getElementById('mode-catalog').addEventListener('click', () => {
    setMode('catalog');
    document.getElementById('sec-causes').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' });
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-cause]');
    if (!a) return;
    e.preventDefault();
    const id = a.getAttribute('data-cause');
    if (!document.getElementById('cause-' + id)) setMode('catalog');
    const card = document.getElementById('cause-' + id);
    if (!card) return;
    card.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
    card.focus({ preventScroll: true });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1600);
  });
}
boot();
</script>
